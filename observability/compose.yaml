name: supportflow-observability
services:
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  jaeger:
    restart: unless-stopped
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
  grafana:
    restart: unless-stopped
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/supportflow/dashboards:ro
  loki:
    restart: unless-stopped
    image: grafana/loki:3.5.5
  alloy:
    restart: unless-stopped
    image: grafana/alloy:v1.10.2
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${HOME}/.supportflow/logs:/logs:ro
      - alloy-state:/var/lib/alloy

volumes:
  alloy-state:
