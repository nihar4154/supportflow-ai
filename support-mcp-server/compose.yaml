services:
  mysql:
    image: mysql:8.4
    container_name: 'support-flow-mysql'
    environment:
      - 'MYSQL_DATABASE=supportflow'
      - 'MYSQL_USER=supportflow'
      - 'MYSQL_PASSWORD=localdev'
      - 'MYSQL_ROOT_PASSWORD=localroot'
    ports:
      - '3306:3306'
    volumes:
      # Named volume -> data survives container restarts / recreation.
      - 'mysql-data:/var/lib/mysql'
      # Scripts here run automatically the FIRST time the data dir is empty (i.e. on a fresh volume) to create the schema and load demo data.
      - './db/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: [ 'CMD-SHELL', 'mysqladmin ping -h localhost -uroot -plocalroot' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
