spring.application.name=support-mcp-server
server.port=8090

# --- Datasource ---------------------------------------------------------------
# Spring Boot starts the Compose services during development. The default path
# is relative to the repository root; Gradle bootRun supplies an absolute path.
spring.docker.compose.file=${SUPPORTFLOW_COMPOSE_FILE:support-mcp-server/compose.yaml}
spring.docker.compose.lifecycle-management=start-only
# Defaults for connections when Compose support is disabled.
spring.datasource.url=${SUPPORTFLOW_DB_URL:jdbc:mysql://localhost:3306/supportflow}
spring.datasource.username=${SUPPORTFLOW_DB_USER:supportflow}
spring.datasource.password=${SUPPORTFLOW_DB_PASSWORD:localdev}

# --- JPA / Hibernate ----------------------------------------------------------
# Schema + data are owned by db/init/*.sql (run by the MySQL container).
# Keep Hibernate read-only on DDL so it never drops/recreates the seeded tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- MCP server ---------------------------------------------------------------
spring.ai.mcp.server.name=support-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.instructions=Tools for an email support agent: look up customers, \
  orders and products; detect duplicate charges; check warranty windows; review ticket \
  history for repeat failures; issue refunds; and log the resolution.
spring.ai.mcp.server.protocol=STREAMABLE
